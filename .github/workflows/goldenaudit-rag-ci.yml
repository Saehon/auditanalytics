name: GoldenAudit-RAG synthetic baseline tests
on:
  push:
    paths:
      - 'goldenaudit-rag/**'
      - '.github/workflows/goldenaudit-rag-ci.yml'
  pull_request:
    paths:
      - 'goldenaudit-rag/**'
      - '.github/workflows/goldenaudit-rag-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s goldenaudit-rag/tests -v
      - run: python -m py_compile goldenaudit-rag/huggingface/app.py
      - run: python -c "import json,pathlib; p=pathlib.Path('goldenaudit-rag/kaggle/goldenaudit_rag_synthetic_demo.ipynb'); d=json.loads(p.read_text()); assert d['nbformat']==4 and len(d['cells'])>=2"
